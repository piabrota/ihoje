name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        
        # Install mangekyou-mcp dependencies
        if [ -f scripts/mangekyou-mcp/requirements.txt ]; then
          pip install -r scripts/mangekyou-mcp/requirements.txt
        fi
        
        # Install mangekyo-mcp dependencies
        if [ -f scripts/mangekyo-mcp/requirements.txt ]; then
          pip install -r scripts/mangekyo-mcp/requirements.txt
        fi
    
    - name: Lint with ruff
      run: |
        ruff check scripts/
    
    - name: Test with pytest
      run: |
        pytest scripts/mangekyou-mcp/test_*.py
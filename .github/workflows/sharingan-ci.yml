name: Sharingan CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sharingan/**'
      - 'pokeball/**'  # Dependency of sharingan
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'sharingan/**'
      - 'pokeball/**'  # Dependency of sharingan
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build and Test Sharingan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./sharingan -> target"
          
      - name: Check formatting
        working-directory: ./sharingan
        run: cargo fmt --check
        
      - name: Run clippy
        working-directory: ./sharingan
        run: cargo clippy --all-features

      - name: Build
        working-directory: ./sharingan
        run: cargo build --verbose

      - name: Run tests
        working-directory: ./sharingan
        run: cargo test --verbose
        
      - name: Run benchmarks
        working-directory: ./sharingan
        run: cargo bench --no-run  # Just compile benchmarks to check they build, don't run them
        
  deploy:
    name: Deploy Sharingan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./sharingan -> target"
          
      - name: Build release binary
        working-directory: ./sharingan
        run: cargo build --release
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharingan-binary
          path: target/release/sharingan
          retention-days: 7
      
      # If you're using Docker for deployment, add Docker build and push steps here
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sharingan  # Create this Dockerfile for Sharingan
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sharingan:latest
            ghcr.io/${{ github.repository }}/sharingan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
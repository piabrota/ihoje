name: Workspace CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
    paths-ignore:
      - 'sharingan/**'
      - 'tobira/**'
      - 'gugu/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
    paths-ignore:
      - 'sharingan/**'
      - 'tobira/**'
      - 'gugu/**'
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
        
  workflow-info:
    name: Workflow Information
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Display Workflow Info
        run: |
          echo "This is the general workspace CI workflow. Component-specific workflows include:"
          echo "- sharingan-ci.yml: For the Sharingan event scraper"
          echo "- tobira-ci.yml: For the Tobira frontend"
          echo "- gugu-ci.yml: For the Gugu infrastructure component"
          echo ""
          echo "See .github/workflows/ci-readme.md for more information."
name: Tobira CI

on:
  push:
    branches: [ main ]
    paths:
      - 'tobira/**'
      - 'pokeball/**'  # Dependency of tobira
      - 'sharingan/**' # Optional dependency
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'tobira/**'
      - 'pokeball/**'
      - 'sharingan/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build and Test Tobira
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./tobira -> target"
          
      - name: Check formatting
        working-directory: ./tobira
        run: cargo fmt --check
        
      - name: Run clippy
        working-directory: ./tobira
        run: cargo clippy --all-features --target wasm32-unknown-unknown
        
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Build with Trunk
        working-directory: ./tobira
        run: trunk build --release

      - name: Run tests
        working-directory: ./tobira
        run: wasm-pack test --headless --chrome

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tobira-dist
          path: tobira/dist
          retention-days: 7

  deploy:
    name: Deploy Tobira
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tobira-dist
          path: tobira/dist
      
      # Docker deployment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tobira
          file: ./tobira/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tobira:latest
            ghcr.io/${{ github.repository }}/tobira:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # GitHub Pages deployment (alternative)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: false  # Disabled by default, enable if using GitHub Pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tobira/dist
name: Pokeball CI

on:
  push:
    branches: [ main ]
    paths:
      - 'pokeball/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pokeball.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pokeball/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pokeball.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build and Test Pokeball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./pokeball -> target"
          
      - name: Install just
        uses: extractions/setup-just@v1
        
      - name: Run CI checks using Just
        run: just --justfile justfiles/ci.justfile pokeball-ci
        
  publish:
    name: Publish Pokeball
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./pokeball -> target"
          
      - name: Build package
        working-directory: ./pokeball
        run: cargo package
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokeball-package
          path: pokeball/target/package/
          retention-days: 7
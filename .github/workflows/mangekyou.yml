name: Mangekyou CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/mangekyou-mcp/**"
      - ".github/workflows/mangekyou.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/mangekyou-mcp/**"
      - ".github/workflows/mangekyou.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./scripts/mangekyou-mcp
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install -e .

      - name: Install just
        uses: extractions/setup-just@v1
        
      - name: Run CI checks using Just
        run: just --justfile justfiles/ci.justfile mangekyou-ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./scripts/mangekyou-mcp
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: ./scripts/mangekyou-mcp
        run: |
          python -m build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Publish to Artifact Registry
        working-directory: ./scripts/mangekyou-mcp
        run: |
          twine upload --repository-url https://us-central1-python.pkg.dev/${GCP_PROJECT_ID}/python-repo/ \
          --username oauth2accesstoken \
          --password "$(gcloud auth print-access-token)" \
          dist/*
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
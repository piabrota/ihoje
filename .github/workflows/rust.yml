name: Rust CI Master

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sharingan/**'
      - 'tobira/**'
      - 'gugu/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'sharingan/**'
      - 'tobira/**'
      - 'gugu/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.84.0
        components: clippy, rustfmt
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Clippy
      run: cargo clippy -- -D warnings
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
      
    - name: Check for outdated dependencies
      run: |
        cargo install cargo-outdated
        cargo outdated --exit-code 1
  
  workflow-overview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check component-specific workflows
        run: |
          echo "Main workflow passed!"
          echo "Component-specific workflows:"
          echo "- Sharingan: .github/workflows/sharingan-ci.yml"
          echo "- Tobira: .github/workflows/tobira-ci.yml"
          echo "- Gugu: .github/workflows/gugu-ci.yml"
          echo ""
          echo "These workflows run independently when their respective components change."
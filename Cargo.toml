[workspace]
resolver = "2"
members = [
    "sharingan",
    "pokeball",
    "tobira",
]

# Shared development dependencies for the entire workspace
[workspace.dependencies]
# Serialization
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

# Date handling
chrono = { version = "0.4.35", features = ["serde"] }

# Logging and error handling
log = "0.4.20"
thiserror = "2.0.12"
anyhow = "1.0.81"

# Utils
uuid = { version = "1.7.0", features = ["v4"] }

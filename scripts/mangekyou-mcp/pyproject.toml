[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mangekyou-mcp"
version = "1.0.0"
authors = [
  { name = "Uchiha Clan", email = "noreply@anthropic.com" },
]
description = "Mangekyou MCP - Sharingan-powered Implementation Planning Tool for Claude"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.27.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.4.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]
dev = [
    "ruff>=0.0.278",
    "black>=23.3.0",
    "isort>=5.12.0",
]

[project.scripts]
mangekyou-mcp = "mangekyou_mcp.server:start"

[project.urls]
"Homepage" = "https://github.com/yourusername/mangekyou-mcp"

[tool.setuptools]
packages = ["mangekyou_mcp"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
line-length = 88
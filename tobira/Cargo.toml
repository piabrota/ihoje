[package]
name = "ihoje_tobira"
version = "0.1.0"
edition = "2021"
description = "Shinri no Tobira (Gate of Truth) - WebAssembly interface for iHoje event scraper"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ihoje_tobira"
path = "src/main.rs"

[dependencies]
# Local dependencies
pokeball = { path = "../pokeball" }
sharingan = { path = "../sharingan", optional = true }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true, features = ["wasmbind"] }

# Yew framework
yew = { version = "0.20", features = ["csr"] }
yew-router = "0.17"

# Internationalization
i18nrs = "0.1.3"

# Web functionality
gloo = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlInputElement", 
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Window",
    "Document", 
    "Element", 
    "HtmlElement",
    "console",
    "Location",
    "Navigator",
    "Storage"
]}
js-sys = "0.3"
gloo-storage = "0.2.2"  # Local storage wrapper

# Network requests 
reqwasm = "0.5"  # WebAssembly-friendly HTTP client

# Logging
wasm-logger = "0.2"
console_error_panic_hook = "0.1.7"

# Utils
simple-i18n = "0.1.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
